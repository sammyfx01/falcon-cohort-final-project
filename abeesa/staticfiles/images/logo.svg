<svg width="360" height="120" viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="markGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8a866"/>
      <stop offset="100%" stop-color="#b8894f"/>
    </linearGradient>
  </defs>

  <!-- Mark: minimal hexagon frame with a leaf/flame silhouette -->
