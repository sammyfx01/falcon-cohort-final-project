    <path d="M50 24
             C 66 30, 72 48, 62 64
             C 56 73, 44 73, 38 64
             C 28 48, 34 30, 50 24 Z"
          fill="none" stroke="#f7f2e7" stroke-width="2.5"/>
    <line x1="50" y1="24" x2="50" y2="70" stroke="#f7f2e7" stroke-width="2"/>
  </g>

  <!-- Wordmark -->
  <text x="132" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#f7f2e7" letter-spacing="1">
    Abeesa
  </text>

  <!-- Tagline -->
  <text x="134" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#d8a866">
