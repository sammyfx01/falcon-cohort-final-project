{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Create an account</h1>
      <p class="auth-subtitle">Join to order from local restaurants or list your own.</p>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-full">Register</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in here</a></p>
    </div>
  </div>
{% endblock %}
