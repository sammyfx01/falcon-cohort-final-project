{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in to manage your restaurant or place an order.</p>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-full">Log in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </div>
  </div>
{% endblock %}
