{% extends "base.html" %}
{% block title %}Contact Us{% endblock %}

{% block content %}
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Contact Us</h1>
      <p class="auth-subtitle">Have a question or feedback? Send us a message and we'll get back to you.</p>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-full">Send Message</button>
      </form>
    </div>
  </div>
{% endblock %}
