{% extends "base.html" %}
{% block title %}Contact {{ restaurant.name }}{% endblock %}

{% block content %}
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Contact {{ restaurant.name }}</h1>
      <p class="auth-subtitle">Send this restaurant a message directly.</p>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-full">Send Message</button>
      </form>
    </div>
  </div>
{% endblock %}
