{% extends "base.html" %}
{% block title %}Delete {{ item.name }}{% endblock %}

{% block content %}
  <h1>Delete "{{ item.name }}"?</h1>
  <p>This action cannot be undone.</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete it</button>
    <a href="{% url 'restaurant_detail' item.restaurant.pk %}">Cancel</a>
  </form>
{% endblock %}
